<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lamp Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #302e3e;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Main Box */
.container {
    width: 900px;
    max-width: 95%;
    min-height: 550px;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 5px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Light Glow */
.glow {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(255, 245, 180, 0.25),
        rgba(255, 245, 180, 0.08),
        transparent 70%
    );
    left: 50px;
    top: 20px;
    transition: 0.5s;
    pointer-events: none;
}

body.off .glow {
    opacity: 0;
}

/* Lamp */
.lamp {
    position: absolute;
    left: 120px;
    top: 100px;
    width: 220px;
    height: 330px;
}

/* Lamp Shade */
.shade {
    position: absolute;
    width: 150px;
    height: 80px;
    background: white;
    border-radius: 80px 80px 20px 20px;
    left: 30px;
    top: 0;
    box-shadow: 0 0 40px rgba(255,255,220,0.9);
    transition: 0.4s;
}

/* Shade Off */
body.off .shade {
    background: #777;
    box-shadow: none;
}

/* Stand */
.stand {
    position: absolute;
    width: 12px;
    height: 140px;
    background: #eee;
    left: 99px;
    top: 75px;
}

/* Base */
.base {
    position: absolute;
    width: 70px;
    height: 12px;
    background: #eee;
    border-radius: 10px;
    left: 70px;
    top: 210px;
}

/* Pull Cord */
.cord {
    position: absolute;
    width: 2px;
    height: 70px;
    background: #ddd;
    left: 145px;
    top: 70px;
}

.ball {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ddd;
    left: -5px;
    bottom: -5px;
    cursor: pointer;
}

/* Login Box */
.login-box {
    width: 300px;
    padding: 30px 25px;
    border-radius: 20px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    position: absolute;
    right: 100px;
    color: white;
}

.login-box h2 {
    text-align: center;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-size: 12px;
    color: #aaa;
    margin-bottom: 7px;
}

.form-group input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.3);
    outline: none;
    background: rgba(255,255,255,0.12);
    color: white;
}

.form-group input::placeholder {
    color: #aaa;
}

.login-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #fff1a8, #fff8cf);
    color: #222;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.login-btn:hover {
    transform: scale(1.03);
    box-shadow: 0 0 20px rgba(255,245,170,0.6);
}

#message {
    text-align: center;
    margin-top: 15px;
    font-size: 13px;
}

/* Mobile */
@media (max-width: 700px) {

    .container {
        min-height: 650px;
    }

    .lamp {
        left: 50%;
        transform: translateX(-50%);
        top: 40px;
        scale: 0.65;
    }

    .login-box {
        right: auto;
        left: 50%;
        transform: translateX(-50%);
        top: 300px;
        width: 280px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="glow"></div>

    <!-- LAMP -->
    <div class="lamp">

        <div class="shade"></div>

        <div class="stand"></div>

        <div class="base"></div>

        <div class="cord">
            <div class="ball" id="pullBall"></div>
        </div>

    </div>

    <!-- LOGIN -->
    <div class="login-box">

        <h2>Welcome</h2>

        <form id="loginForm">

            <div class="form-group">
                <label>Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                >
            </div>

            <button class="login-btn" type="submit">
                Sign In
            </button>

            <p id="message"></p>

        </form>

    </div>

</div>


<script>

/* -----------------------
   LAMP ON / OFF
------------------------ */

const ball = document.getElementById("pullBall");

ball.addEventListener("click", function () {

    document.body.classList.toggle("off");

});


/* -----------------------
   LOGIN
------------------------ */

const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    /*
       DEMO LOGIN

       Username: admin
       Password: 1234
    */

    if (username === "admin" && password === "1234") {

        message.style.color = "#7CFF8B";
        message.innerText = "Login Successful!";

        setTimeout(function () {

            window.location.href = "dashboard.html";

        }, 1000);

    } else {

        message.style.color = "#ff6b6b";
        message.innerText =
            "Invalid Username or Password";

    }

});

</script>

</body>
</html>
